name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift check against upstream pstack main.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install into a scratch DSH home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and check
        run: bash scripts/verify-install.sh
